apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_mib: 200
      tail_sampling:
        decision_wait: 10s
        num_traces: 200000
        policies:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ERROR]

          - name: slow-traces
            type: latency
            latency:
              threshold_ms: 150

          - name: force-sample-attr
            type: string_attribute
            string_attribute:
              key: sample
              values: ["true"]

          - name: baseline-probabilistic
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

    exporters:
      otlp:
        endpoint: tempo-server:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [tail_sampling, memory_limiter, batch]
          exporters: [otlp]
